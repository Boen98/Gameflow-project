<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="startscherm.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <title>startscherm</title>
  </head>
  <body>
    <header>
      <section>
        <nav>
          <div class="vakje">
            <div class="logo">
              <h1 class="gamenaam">
                Panda<br />
                <span class="titeldeel">Restaurant Sim</span>
              </h1>
            </div>
            <form action="">
              <div class="buttons">
                <div class="invoercontainer">
                  <input
                    type="text"
                    class="invoer"
                    placeholder="gamesessie"
                    id="gamesessieInput"
                    maxlength="5"
                    aria-label="Gamesessie"
                  />
                  <input
                    type="text"
                    class="invoer"
                    placeholder="teamcode"
                    id="teamcodeInput"
                    maxlength="5"
                    aria-label="Teamcode"
                  />
                </div>
                <div class="verderbutton">
                  <button type="button" id="submit">Join</button>
                  <button type="button" id="uitloggen">Uitloggen</button>
                </div>
              </div>
            </form>
          </div>
        </nav>
      </section>
    </header>
  </body>
</html>
