    <link rel="stylesheet" href="vragen.css" />

  <body>
    <div class="paginaindeling">
      <header>
        <nav>
          <ul>
            <li><a href="dashboard.html">dashboard</a></li>
            <li><a href="marktinformatie.html">marktinformatie</a></li>
            <li><a class="actief" href="beslissingen.html">beslissingen</a></li>
            <li><a href="resultaten.html">resultaten</a></li>
            <li><a href="rapportages.html">rapportages</a></li>
          </ul>
        </nav>
      </header>
      <main>
        <section class="inhoud">
          <h1 class="ronde" id="ronde">Ronde 1</h1>
          <div class="rechterkant">
            <div class="overzicht">
              <div class="overzichtdeel">
                <h2 class="overzichttitel">startbudget</h2>
                <h3 class="overzichtdeelinfo" id="startbudget">€ 500.000</h3>
              </div>
              <div class="overzichtdeel">
                <h2 class="overzichttitel">verwachte bezoekers</h2>
                <h3 class="overzichtdeelinfo" id="verwachte bezoekers">

              </div>
              <div class="overzichtdeel">
                <h2 class="overzichttitel">beschikbaar na keuzes</h2>
                <h3 class="overzichtdeelinfo">€ 178.000</h3>
              </div>
            </div>
            <div class="vragen">
              <div class="doelgroepmix">
                <h3 class="soortdoelgroep">doelgroep</h3>
                <div class="dropdown">
                  <button class="doelgroepknop"></button>
                  <div class="dropdownknoppen">
                    <button class="leeftijd"></button>
                    <button class="lokaleklanten"></button>
                    <button class="rijkeklanten"></button>
                    <button class="stellen"></button>
                  </div>
                  <button class="levensfase"></button>
                </div>
              </div>
              <div class="entree"></div>
              <div class="personeel"></div>
              <div class="kanaalmix"></div>
              <div class="marketing"></div>
              <div class="onderhoud"></div>
            </div>
